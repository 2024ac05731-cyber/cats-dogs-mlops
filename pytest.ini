[pytest]
testpaths = tests
addopts = -ra
markers =
    needs_data: requires the full Kaggle dataset on disk (skipped in CI, which has no data/)
filterwarnings =
    # Starlette's TestClient warns about httpx; it's the test shim, not our app.
    ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient`
    # Keras 3 warns that .h5 is legacy. Verified on Day 1 that the round-trip is
    # byte-identical, and the assignment spec names .h5 explicitly (ADR-002).
    ignore:You are saving your model as an HDF5 file:UserWarning
    # NumPy 2.x __array__ copy-keyword deprecation, raised from inside Keras.
    ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning
