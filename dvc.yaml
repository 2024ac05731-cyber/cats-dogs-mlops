# DVC pipeline (M1 — data & pipeline versioning).
#
# Two stages mirroring the plan. `dvc repro` is the reproducible entry point;
# `dvc dag` renders the graph for the report/video.
#
# The raw dataset itself is tracked separately with `dvc add data/raw` once the
# real Kaggle download lands (it is not a stage output — nothing in this repo
# *produces* it). Run:
#
#     bash scripts/download.sh
#     python -m src.data          # writes data/corrupt_files.txt
#     dvc add data/raw
#     dvc repro
#     dvc push
#
# Note on `always_changed` for preprocess: its real dependency is the contents of
# data/raw, which DVC tracks via data/raw.dvc. Listing data/raw here as well
# would double-track it, so the dependency is expressed through the .dvc file
# plus the code and the corrupt-file report.

stages:
  preprocess:
    cmd: python -m src.preprocess
    deps:
      - src/data.py
      - src/preprocess.py
      - data/corrupt_files.txt
    outs:
      - data/processed/train.csv
      - data/processed/val.csv
      - data/processed/test.csv

# Added on Day 3 (train) and Day 4 (cross_validate), once src/train.py and
# src/cross_validate.py exist. Declaring them earlier breaks `dvc repro`.
